# Values of kube-prometheus-stack 92.13.1 for scenario F1. Only what drainsim
# reads is kept: Prometheus, the operator, kube-state-metrics (kube_pod_owner)
# and the kubelet ServiceMonitor (cAdvisor container_* metrics). Everything
# runs on the control plane, so the workers hold only the workloads of the
# scenario. The admin API of Prometheus stays disabled (default), so the
# query API is read-only (NFR1).
fullnameOverride: kps

grafana:
  enabled: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
defaultRules:
  create: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  enabled: false
coreDns:
  enabled: false

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 2h
    enableAdminAPI: false
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
